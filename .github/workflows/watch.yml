name: Watch GMUC tennis

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send ntfy test notification only"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: gmuc-tennis-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -c "import os; from notifier import notify; notify(os.environ['NTFY_TOPIC'], '광명 테니스 알림 테스트', '성공! GitHub Actions → ntfy → 갤럭시 연결이 정상입니다.', 'https://reserve.gmuc.co.kr/user/tennis/tennisInsideReservation.do?menu=c&menuFlag=T')"
      - name: Check availability
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py
      - name: Persist notification state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: |
          if git diff --quiet -- state.json 2>/dev/null && [ -f state.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update notification state" || exit 0
          git push
